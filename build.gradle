allprojects {
    group = 'org.least_res_gps'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        // Topobyte repositories
        maven { url 'https://mvn.topobyte.de' }
        maven { url 'https://mvn.slimjars.com' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // JUnit 5 testing framework available across all modules
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}