plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':core')
    implementation project(':geocoding')

    // Mapsforge desktop stack from Maven Central
    implementation 'org.mapsforge:mapsforge-core:0.20.0'
    implementation 'org.mapsforge:mapsforge-map:0.20.0'
    implementation 'org.mapsforge:mapsforge-map-reader:0.20.0'
    implementation 'org.mapsforge:mapsforge-themes:0.20.0'
    implementation 'org.mapsforge:mapsforge-map-awt:0.20.0'
}

application {
    mainClass = 'org.least_res_gps.ui.MainApp'
    applicationDefaultJvmArgs = [
        '--enable-native-access=javafx.graphics',
        '--enable-native-access=javafx.swing'
    ]
}

javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.swing' ]
}